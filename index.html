<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product card</title>
    <link rel="stylesheet" href="cart.css">
</head>
<body>
    <div class="product-container">
        <div class="image-template">
            <div class="product-image">
                <img src="https://tse3.mm.bing.net/th/id/OIP.LvSUjENNNVDdtbdh4u7Q7AHaEJ?r=0&rs=1&pid=ImgDetMain&o=7&rm=3">
               <div class="discount">
                <span>40%</span>
            </div>
        </div>

    </div>

    <div class="product-info-container">
        <div class="price">
            price:
            <span class="current-price">800$</span>
            <span class="old-price">900</span>
        </div>
        <div class="rating">4.5</div>
        <p class="details">Product detailes</p>
        <div class="Buttons">
            <button class="cart-btn">Add to cart</button>
            <button class="buy-btn">buy</button>
        </div>

    </div>
    
</body>
</html>
